name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Issue 46 Windows Diagnostic
        run: node tools/diag-issue-46-win.mjs
      - name: Run launch-config and debug-relaunch tests
        run: node --test sidecars/panel/tests/launch-config.test.mjs sidecars/panel/tests/debug-relaunch.test.mjs
