name: Verify
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official Antigravity 2.34.0 (public installer)
        shell: pwsh
        run: |
          $url = 'https://storage.googleapis.com/antigravity-public/antigravity-hub/2.34.0-5887025308631040/windows-x64/Antigravity-x64.exe'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\ag.exe"
          "size: $((Get-Item "$env:RUNNER_TEMP\ag.exe").Length)"
          foreach ($a in @('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART', '/S')) {
            "trying: $a"
            Start-Process "$env:RUNNER_TEMP\ag.exe" -ArgumentList $a -Wait
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs","$env:ProgramFiles" -Recurse -Filter Antigravity.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { break }
          }
          if (-not $found) { throw 'Antigravity.exe not found after install' }
          "AG_EXE=$($found.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $found.FullName
      - run: node tools/diag-issue-46-real.mjs
